<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KONAMI METAL GEAR Replica</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Header -->
  <header id="header">
    <div class="logo">KONAMI</div>
    <nav>
      <ul id="nav-menu">
        <li><a href="#" data-section="top">TOP</a></li>
        <li><a href="#" data-section="topics">TOPICS</a></li>
        <li><a href="#" data-section="news">NEWS</a></li>
        <li><a href="#" data-section="history">HISTORY</a></li>
        <li><a href="#" data-section="goods">GOODS</a></li>
      </ul>
      <div class="hamburger" id="hamburger">
        <div></div><div></div><div></div>
      </div>
    </nav>
    <div class="lang-selector">JP / EN</div>
  </header>

  <!-- Main Content -->
  <main id="main-content">
    <!-- Hero Slider -->
    <section class="hero-slider full visible">
      <div class="slide active">
        <div class="parallax-bg" style="background-image:url('https://upload.wikimedia.org/wikipedia/en/8/82/Metal_Gear_Solid_3_Snake_Eater_Cover.jpg');"></div>
        <div class="overlay">『これから「メタルギア」をはじめる人へ』公開！</div>
      </div>
      <div class="slide">
        <iframe class="slide-video" src="https://www.youtube.com/embed/7Lkqfj1f7ZM?rel=0&autoplay=0&mute=1" title="MGS Trailer" frameborder="0" allowfullscreen></iframe>
        <div class="overlay">『METAL GEAR SOLID: MASTER COLLECTION Vol.2』予約受付中</div>
      </div>
      <button class="prev">&#10094;</button>
      <button class="next">&#10095;</button>
      <div class="dots">
        <span class="dot active" data-slide="0"></span>
        <span class="dot" data-slide="1"></span>
      </div>
    </section>
  </main>

  <!-- Footer -->
  <footer>
    <div>
      <a href="#">プライバシーポリシー</a>
      <a href="#">利用規約</a>
    </div>
    <div class="social-icons">
      <a href="#"><img src="https://via.placeholder.com/25?text=T" alt="Twitter"></a>
      <a href="#"><img src="https://via.placeholder.com/25?text=F" alt="Facebook"></a>
