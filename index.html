<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>METAL GEAR SOLID Δ: SNAKE EATER</title>
  <style>
    /* Reset & basic styles */
    body { margin:0; font-family:sans-serif; line-height:1.5; }
    a { text-decoration:none; color:#007bff; }
    img { display:block; max-width:100%; height:auto; }

    /* Header */
    header {
      position: fixed;
      top:0; left:0; right:0;
      background: rgba(255,255,255,0.9);
      display:flex; justify-content:space-between; align-items:center;
      padding:10px 20px; box-shadow:none; transition:0.3s;
      z-index:1000;
    }
    header.scrolled { box-shadow:0 2px 8px rgba(0,0,0,0.2); }

    /* Hamburger */
    #hamburger {
      font-size:24px;
      cursor:pointer;
      display:none;
    }
    nav { display:flex; gap:15px; }
    nav.active { display:block; }
    @media(max-width:768px){
      nav { display:none; flex-direction:column; background:#fff; position:absolute; top:50px; left:0; width:100%; padding:10px 0; }
      #hamburger { display:block; }
    }

    /* Hero slider */
    .hero { position:relative; overflow:hidden; height:300px; margin-top:60px; }
    .slide { position:absolute; top:0; left:0; width:100%; height:100%; opacity:0; transition:opacity 1s; }
    .slide.active { opacity:1; }
    .slide img { width:100%; height:100%; object-fit:cover; }

    /* Topics grid */
    .topics-grid {
      display:grid;
      grid-template-columns:repeat(auto-fit, minmax(250px,1fr));
      gap:20px;
      padding:20px;
      margin-top:20px;
    }
    .topic-card { border:1px solid #ccc; border-radius:8px; overflow:hidden; padding-bottom:10px; background:#fff; }
    .topic-card h3 { margin:10px; font-size:18px; }
    .topic-card p { margin:0 10px 10px; }
    .topic-card a { margin:0 10px; display:inline-block; margin-bottom:10px; }

    /* Footer */
    footer { text-align:center; padding:20px; background:#f0f0f0; margin-top:20px; }
    .social-icons { margin:10px 0; display:flex; justify-content:center; gap:10px; }
  </style>
</head>
<body>

  <!-- Header -->
  <header id="header">
    <div>LOGO</div>
    <div id="hamburger">&#9776;</div>
    <nav id="nav-menu">
      <a href="#">Home</a>
      <a href="#">Topics</a>
      <a href="#">Contact</a>
    </nav>
  </header>

  <!-- Hero slider -->
  <section class="hero">
    <div class="slide active">
      <img src="https://via.placeholder.com/1200x300?text=Slide+1" alt="Slide 1">
    </div>
    <div class="slide">
      <img src="https://via.placeholder.com/1200x300?text=Slide+2" alt="Slide 2">
    </div>
    <div class="slide">
      <img src="https://via.placeholder.com/1200x300?text=Slide+3" alt="Slide 3">
    </div>
  </section>

  <!-- Topics Grid -->
  <section class="topics-grid">
    <article class="topic-card">
      <img src="https://via.placeholder.com/400x180?text=Topic+1" alt="Topic 1">
      <h3>METAL GEAR SOLID Δ: SNAKE EATER</h3>
      <p>オンライン対戦モード「FOX HUNT」配信開始！</p>
      <a href="#">詳細を見る</a>
    </article>
    <article class="topic-card">
      <img src="https://via.placeholder.com/400x180?text=Topic+2" alt="Topic 2">
      <h3>『MGSΔ: SNAKE EATER』トレーラー公開</h3>
      <p>公式YouTubeで公開中</p>
      <a href="#">詳細を見る</a>
    </article>
    <article class="topic-card">
      <img src="https://via.placeholder.com/400x180?text=Topic+3" alt="Topic 3">
      <h3>コラボ商品予約受付中</h3>
      <p>PUNK DRUNKERSコラボ商品</p>
      <a href="#">詳細を見る</a>
    </article>
    <article class="topic-card">
      <img src="https://via.placeholder.com/400x180?text=Topic+4" alt="Topic 4">
      <h3>オリジナルサウンドトラック発売</h3>
      <p>音楽ストリーミングサービスで配信開始！</p>
      <a href="#">詳細を見る</a>
    </article>
  </section>

  <!-- Footer -->
  <footer>
    <div>
      <a href="#">プライバシーポリシー</a> | 
      <a href="#">利用規約</a>
    </div>
    <div class="social-icons">
      <a href="#"><img src="https://via.placeholder.com/25?text=T" alt="Twitter"></a>
      <a href="#"><img src="https://via.placeholder.com/25?text=F" alt="Facebook"></a>
    </div>
    <div>© 2026 KONAMI</div>
  </footer>

  <!-- JS -->
  <script>
    // Header scroll effect
    const header = document.getElementById('header');
    window.addEventListener('scroll', () => {
      if(window.scrollY > 50){ header.classList.add('scrolled'); }
      else{ header.classList.remove('scrolled'); }
    });

    // Hero slider
    const slides = document.querySelectorAll('.slide');
    let currentSlide = 0;
    setInterval(()=>{
      slides[currentSlide].classList.remove('active');
      currentSlide = (currentSlide+1)%slides.length;
      slides[currentSlide].classList.add('active');
    },5000);

    // Hamburger menu
    const hamburger = document.getElementById('hamburger');
    const navMenu = document.getElementById('nav-menu');
    hamburger.addEventListener('click', ()=>{
      navMenu.classList.toggle('active');
    });
  </script>

</body>
</html>
